name: "Python Build"
description: "Instala dependencias, ejecuta tests opcionales y empaqueta una app Python"

inputs:
  python_version:
    description: "Python version"
    required: false
    default: "3.12"

  working_directory:
    description: "Directorio donde vive la app Python"
    required: false
    default: "."

  run_tests:
    description: "Run tests (true / false)"
    required: false
    default: "false"

  test_command:
    description: "Comando de tests (e.g. pytest -q)"
    required: false
    default: "pytest -q"

  dependency_file:
    description: "Archivo de dependencias para cache e instalación"
    required: false
    default: "requirements.txt"

  build_command:
    description: "Comando de build (e.g. python -m build)"
    required: false
    default: "python -m build"

runs:
  using: "composite"
  steps:
    # Instalar la versión de Python especificada 
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
        cache: pip  # Habilita el cacheo de dependencias pip
        cache-dependency-path: ${{ inputs.working_directory }}/${{ inputs.dependency_file }}

    # Actualiza pip a la última versión
    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip
      working-directory: ${{ inputs.working_directory }}

    # Instala dependencias según el archivo especificado (requirements.txt o pyproject.toml)
    - name: Install dependencies
      shell: bash
      run: |
        set -e
        if [ -f "${{ inputs.dependency_file }}" ]; then
          pip install -r "${{ inputs.dependency_file }}"
        elif [ -f "pyproject.toml" ]; then
          # Instala el proyecto editable si usa pyproject
          pip install -e .
        else
          echo "No se encontró requirements.txt ni pyproject.toml. Saltando instalación."
        fi
      working-directory: ${{ inputs.working_directory }}

    # Instala el paquete build si no está ya instalado
    - name: Ensure build tool
      shell: bash
      run: pip install --upgrade build
      working-directory: ${{ inputs.working_directory }}

    # Ejecuta tests si se ha solicitado
    - name: Run tests
      if: ${{ inputs.run_tests == 'true' }}
      shell: bash
      run: ${{ inputs.test_command }}
      working-directory: ${{ inputs.working_directory }}

    # Empaqueta la aplicación Python, creando los artefactos en dist/
    - name: Build Python package
      shell: bash
      run: ${{ inputs.build_command }}
      working-directory: ${{ inputs.working_directory }}

    # Sube lo compilado en el build como artefactos para pasos posteriores
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-build
        path: |
          ${{ inputs.working_directory }}/dist
          ${{ inputs.working_directory }}/${{ inputs.dependency_file }}
          ${{ inputs.working_directory }}/pyproject.toml
          ${{ inputs.working_directory }}/poetry.lock